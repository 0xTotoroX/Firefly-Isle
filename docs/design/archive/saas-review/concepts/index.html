<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="darkreader-lock"><meta name="color-scheme" content="light dark"><title>病历管理 · 页面方案</title>
<style>
:root{color-scheme:light;--bg:#f3f3f3;--page:#fff;--text:#181818;--muted:#666;--line:#dedede}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1560px;margin:auto;padding:28px 32px 60px}a{color:inherit}header{display:flex;gap:24px;justify-content:space-between;align-items:center;margin-bottom:32px}header a{font-size:14px;color:var(--muted);text-decoration:none}h1{font-size:28px;font-weight:500;margin:0}p{margin:8px 0;color:var(--muted)}nav{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0}nav a{display:inline-block;padding:9px 16px;text-decoration:none;border-radius:8px;font-size:15px;color:var(--muted)}nav a[aria-current]{background:var(--page);color:var(--text);box-shadow:0 0 0 1px var(--line)}nav a:hover{color:var(--text)}a:focus-visible{outline:2px solid #0d807b;outline-offset:4px}figure{margin:0}figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--page)}figcaption{display:flex;justify-content:space-between;gap:24px;align-items:baseline;margin-top:20px}figcaption strong{font-weight:500}figcaption p,figcaption a{font-size:14px}#initial-styles{margin:0 0 24px}#initial-styles nav{margin:8px 0}details{margin-top:36px;color:var(--muted);font-size:14px}summary{cursor:pointer;padding:8px 0}details p{max-width:820px}footer{margin-top:36px;font-size:13px;color:var(--muted)}@media(max-width:700px){main{padding:20px 16px 40px}header{margin-bottom:24px}h1{font-size:24px}nav a{padding:8px 12px;font-size:14px}figcaption{display:block}figure{overflow:auto}figure img{min-width:900px}figure:focus-visible{outline:2px solid #0d807b;outline-offset:3px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101010;--page:#181818;--text:#f5f5f5;--muted:#aaa;--line:#353535}}
</style></head><body><main><header><h1>页面方案</h1><a href="../index.html">返回设计系统</a></header><p>每张图左侧为浅色，右侧为深色。先比较布局与信息层级。</p><nav id="page-nav" aria-label="页面方案"></nav><details id="initial-styles"><summary>查看首轮四种风格</summary><nav id="style-nav" aria-label="首轮风格"></nav></details><figure tabindex="0" aria-label="黑白主题方案图，窄屏可横向滚动"><img id="concept" alt=""><figcaption><div><strong id="title"></strong><p id="note"></p></div><a id="original" target="_blank" rel="noopener">查看原图 ↗</a></figcaption></figure><details><summary>参考与方案说明</summary><p>参考 Pokecut 的侧栏与主内容区、Codex 官方文档的任务组织，以及 Cherry Studio v2.1.4 源码的阅读限宽和可收起侧区。设计取舍及核验边界见<a href="../DESIGN-SYSTEM.md#页面方案与参考边界">完整规范</a>。</p><p>图像模型生成的评审草案，尚未应用到正式产品。患者资料与数字均为虚构示例；图中文字不作为精确组件规格。</p></details><footer>病历管理 · 设计评审</footer></main><script>
const concepts=[{"id": "05-calm-home", "title": "工作台", "note": "最近记录与一条待办，常用操作清楚可见。", "src": "05-calm-home.png"}, {"id": "06-calm-intake", "title": "单栏输入", "note": "一个编辑区，附件与整理动作就在手边。", "src": "06-calm-intake.png"}, {"id": "07-calm-record", "title": "病历阅读", "note": "阅读正文为主，来源资料按需展开。", "src": "07-calm-record.png"}, {"id": "01-quiet-workspace", "title": "极简工作台", "note": "列表为主，待办在右侧。", "src": "01-quiet-workspace.png", "initial": true}, {"id": "02-editorial-journal", "title": "书页档案", "note": "以时间和阅读顺序组织内容。", "src": "02-editorial-journal.png", "initial": true}, {"id": "03-three-pane-desk", "title": "分栏工作区", "note": "并排查看记录、正文与资料。", "src": "03-three-pane-desk.png", "initial": true}, {"id": "04-soft-native", "title": "柔和原生", "note": "浅侧栏、单一主画布与柔和控件。", "src": "04-soft-native.png", "initial": true}];
const nav=document.querySelector('#page-nav'), styles=document.querySelector('#style-nav');
for(const [target,initial] of [[nav,false],[styles,true]])target.innerHTML=concepts.filter(c=>Boolean(c.initial)===initial).map(c=>'<a href="#'+c.id+'">'+c.title+'</a>').join('');
function show(){const c=concepts.find(c=>'#'+c.id===location.hash)||concepts[0];document.querySelector('#concept').src=c.src;document.querySelector('#concept').alt=c.title+'，浅色与深色主题对照';document.querySelector('#title').textContent=c.title;document.querySelector('#note').textContent=c.note;document.querySelector('#original').href=c.src;document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+c.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
addEventListener('hashchange',show);show();
</script></body></html>
