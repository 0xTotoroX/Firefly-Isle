<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C48A4A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="一页萤屿" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Firefly Isle，一页纸肿瘤治疗时间线与病历整理工作台。"
    />
    <link rel="icon" href="/logo-island-lighthouse.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const theme = window.localStorage.getItem('firefly-theme') === 'light' ? 'light' : 'dark'
        const accent = window.localStorage.getItem('firefly-accent') || '#C48A4A'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.dataset.theme = theme
        if (/^#[0-9A-Fa-f]{6}$/.test(accent)) {
          document.documentElement.style.setProperty('--ff-accent', accent)
          document.documentElement.style.setProperty('--ff-accent-primary', accent)
          document.documentElement.style.setProperty('--ff-accent-warning', accent)
          document.documentElement.dataset.accent = accent
        }
      } catch {
        document.documentElement.classList.add('dark')
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>一页萤屿 · 临床时间线</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
