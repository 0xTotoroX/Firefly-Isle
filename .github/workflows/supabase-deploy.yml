name: supabase-deploy

on:
  workflow_dispatch:
    inputs:
      skip-migrations:
        description: Skip database migrations (functions only)
        required: false
        default: false
        type: boolean

# Deploy Supabase migrations and edge functions. Everything is gated on
# repository secrets; when they are absent the job exits early and the
# manual runbook in docs/operations/supabase/README.md remains the path.
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required secrets
        id: secrets
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID secrets are not configured. Skipping deploy; follow docs/operations/supabase/README.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.enabled == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push database migrations
        if: steps.secrets.outputs.enabled == 'true' && github.event.inputs.skip-migrations != 'true'
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::SUPABASE_DB_URL secret is required for db push (pooler URI per docs/operations/supabase/README.md)."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy edge functions
        if: steps.secrets.outputs.enabled == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
