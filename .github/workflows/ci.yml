name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|ci|build|chore|perf|style|revert)(\([a-z0-9._-]+\))?(!)?: .+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits:"
            echo "  <type>[optional scope]: <description>"
            echo "Allowed types: feat, fix, docs, refactor, test, ci, build, chore, perf, style, revert"
            echo "Examples:"
            echo "  feat(provider-settings): add user-owned Kimi preset"
            echo "  fix(auth): preserve session after privacy gate redirect"
            echo "  docs(governance): add community health files"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Export build env from wrangler.jsonc
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const vars = config.vars ?? {}
          const lines = Object.entries(vars)
            .filter(([key]) => key.startsWith('VITE_'))
            .map(([key, value]) => `${key}=${String(value)}`)
            .join('\n')
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines}\n`)
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Cache PostgreSQL test image
        run: docker pull postgres:18-alpine

      - name: Run isolated database behavior checks
        run: npm run test:database

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build app
        run: npm run build
